<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Countries API</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Karla:ital,wght@0,200..800;1,200..800&family=Kumbh+Sans:wght@100..900&family=League+Spartan:wght@100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Overpass:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Raleway:ital,wght@0,100..900;1,100..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&family=Rubik:ital,wght@0,300..900;1,300..900&family=Space+Grotesk:wght@300..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./dist/style.css">
</head>
<body class="light-mode">
    <nav class="navbar">
        <h1>Where in the world?</h1>
        <button id="toggle__theme">Dark Mode</button>
    </nav>
    <main class="main__details">
        <button id="back">Back</button>
        <div class="country__details">
            <img id="country-flag" src="" alt="">
            <div class="wrapper__details">
                <h2 id="country-name"></h2>
                <div class="ul__wrapper">
                    <ul>
                        <li>Native Name: <span id="country-nativename"></span></li>
                        <li>Population: <span id="country-population"></span></li>
                        <li>Region: <span id="country-region"></span></li>
                        <li>Sub Region: <span id="country-subregion"></span></li>
                        <li>Capital: <span id="country-capital"></span></li>
                    </ul>
                    <ul>
                        <li>Top Level Domain: <span id="country-topleveldomain"></span></li>
                        <li>Currencies: <span id="country-currency"></span></li>
                        <li>Languages: <span id="country-languages"></span></li>
                    </ul>
                </div>
                <div class="border__countries">
                    <h3>Border Countries:</h3>
                    <div class="border__countries__info">
                        
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="js/country_details.js"></script>
</html>
